{{define "title"}}{{.Title}}{{end}}
{{define "content"}}
<article class="post">
  <header>
    <h1>{{.Title}}</h1>
    <p class="meta">
      <time datetime="{{.Date}}">{{formatTime "January 2, 2006" .Date}}</time>
      {{with .Metadata.author}} · by {{.}}{{end}}
      {{with .Metadata.reading_minutes}} · {{.}} min read{{end}}
    </p>
    {{if .Tags}}
    <ul class="tags">
      {{range .Tags}}<li><a href="/tags/{{.}}/">#{{.}}</a></li>{{end}}
    </ul>
    {{end}}
  </header>
  <section class="body">
    {{.Content}}
  </section>
</article>
{{end}}
